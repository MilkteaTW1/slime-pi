name: Request or offer a language
description: Ask for a language, or say you will translate one
labels: [good first issue, documentation]
body:
  - type: input
    id: lang
    attributes:
      label: Language
      description: Name and tag, for example Japanese (ja)
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who will translate?
      options: [I will open a PR, I need someone else to]
    validations:
      required: true
